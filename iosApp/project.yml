name: BPMApp
options:
  bundleIdPrefix: pe.bpm
  deploymentTarget:
    iOS: "15.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    exactVersion: 10.0.0
targets:
  BPMApp:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: pe.bpm.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: "$(SRCROOT)/../composeApp/build/generated/config/ios/App-Info.plist"
        INFOPLIST_KEY_CFBundleDisplayName: BPM
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework ComposeApp"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build KMP framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(SRCROOT)/../composeApp/build/generated/config/ios/App-Info.plist"
  BPMAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BPMApp
    settings:
      base:
        ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: pe.bpm.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BPMApp:
    build:
      targets:
        BPMApp: all
        BPMAppUITests: [test]
    test:
      targets: [BPMAppUITests]
