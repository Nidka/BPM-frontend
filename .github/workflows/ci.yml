name: Frontend CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test web server
        run: node --test scripts/*.test.mjs web/*.test.mjs
      - name: Test shared code and build web and Android
        run: ./gradlew :composeApp:jvmTest :composeApp:wasmJsBrowserDistribution :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-web-and-android
          path: |
            composeApp/build/dist/wasmJs/productionExecutable
            composeApp/build/outputs/apk/debug/*.apk
      - name: Build deployment image
        run: docker build -t bpm-frontend:ci .
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile iOS framework for simulator
        run: ./gradlew :composeApp:iosSimulatorArm64Test :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Prepare XcodeGen
        run: |
          curl --fail --location --silent --show-error --retry 3 https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip -o "$RUNNER_TEMP/bpm-xcodegen.zip"
          unzip -q "$RUNNER_TEMP/bpm-xcodegen.zip" -d "$RUNNER_TEMP/bpm-xcodegen"
          chmod +x "$RUNNER_TEMP/bpm-xcodegen/xcodegen/bin/xcodegen"
      - name: Compile native iOS host and Google SDK
        env:
          XCODEGEN_BIN: ${{ runner.temp }}/bpm-xcodegen/xcodegen/bin/xcodegen
        run: bash scripts/build-ios.sh
