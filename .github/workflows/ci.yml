name: Frontend CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test web server
        run: node --test web/server.test.mjs
      - name: Test shared code and build web and Android
        run: ./gradlew :composeApp:jvmTest :composeApp:wasmJsBrowserDistribution :composeApp:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-web-and-android
          path: |
            composeApp/build/dist/wasmJs/productionExecutable
            composeApp/build/outputs/apk/debug/*.apk
      - name: Build deployment image
        run: docker build -t bpm-frontend:ci .
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS framework for simulator
        run: ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64 --stacktrace
